# `spike/` is deliberately excluded: those are throwaway phase-0 harnesses with
# their own installs, and folding them in would let a spike dependency drift
# into the product tree.
#
# `apps/iris-web` is excluded because pnpm cannot extract esbuild in this
# environment (see notes/spike/RESULTS.md): the rename step it uses races something
# holding the freshly written binary, deterministically. npm writes in place and
# succeeds, so the browser app is npm-managed and reaches workspace code through
# Vite aliases rather than `workspace:*`.
packages:
  - 'packages/*'
  - 'apps/*'
  - '!apps/iris-web'

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.2'
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/cordis-plugin-group@1.0.2'
  - '@deepseek-ai/cordis-plugin-hmr@1.0.17'
  - '@deepseek-ai/cordis-plugin-include@1.0.7'
  - '@deepseek-ai/cordis-plugin-loader@1.0.3'
  - '@deepseek-ai/cordis-plugin-logger-console@1.0.2'
  - '@deepseek-ai/cordis-plugin-timer@1.1.4'
  - '@deepseek-ai/schemastery@3.18.2'
