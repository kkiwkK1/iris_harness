# The Iris host composition.
#
# Everything is a row. Swapping the model provider, the prompt registry or the
# persistence backend is an edit here, not a code change — which is the whole
# reason Iris sits on Cordis rather than on a monolith.
#
# Entries start concurrently: order in this file guarantees nothing, and load
# order comes from service dependencies (`inject`).

- id: logger
  name: '@deepseek-ai/cordis-plugin-logger-console'
  config:
    # The exporter's own default threshold is 1 (INFO), which silently drops
    # every `ctx.logger.warn` in the composition — the pre-profile layout
    # warning, the app service's survived-failure reports, the transport's
    # socket and internal-error warnings, and the carrier's per-request
    # failures. All of them are things someone is meant to read, and a warning
    # nobody can see is indistinguishable from a bug.
    levels:
      default: 2

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

# The ordered system-prompt registry. Iris registers the persona here and
# assembles the rest itself, because roleplay needs depth injection that a
# system-prompt registry cannot express.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: ''

# The model registry.
- id: llm
  name: '@deepseek-ai/dsh-llm'

# One adapter covers OpenAI, OpenRouter, Ollama, llama.cpp, TextGen WebUI,
# DeepSeek and anything else speaking the same wire. Point it somewhere with
# IRIS_BASE_URL; a local llama.cpp or Ollama needs no key.
- id: llm-openai-compat
  name: '@iris/llm-openai-compat'
  config:
    provider: default
    displayName: OpenAI-compatible endpoint
    baseURL: !!js process.env.IRIS_BASE_URL ?? 'http://127.0.0.1:11434/v1'
    apiKeyEnv: !!js process.env.IRIS_API_KEY_ENV
    models:
      - id: !!js process.env.IRIS_MODEL ?? 'local-model'
        contextWindow: 32768

# The browser carrier. `dsh-host-webserver` ships no TLS and no authentication —
# its own README says so — so this binds to loopback and trusts the machine.
# Serving Iris to a network needs a reverse proxy in front, not `0.0.0.0` here —
# and `0.0.0.0` here now refuses to start until the rpc row below names the hosts
# that proxy answers to, because a loopback bind is a bind and not an access
# control (`notes/packages/iris-rpc-host/DEVIATIONS.md` §1).
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: !!js Number(process.env.IRIS_PORT ?? 8787)

# HTTP + WebSocket transport for the Iris protocol. Domain-free: it only routes
# frames to whatever registered a handler.
- id: rpc
  name: '@iris/rpc-host'
  config:
    # Only for a browser dev server on another origin. Prefer proxying
    # /iris/rpc and /iris/events from that server instead, which keeps the page
    # same-origin and leaves this empty.
    allowedOrigins: !!js (process.env.IRIS_DEV_ORIGIN ?? '').split(',').filter(Boolean)
    # Exact `host:port` values this host answers to, comma-separated, besides
    # loopback on the port it actually bound — which is derived, so the ordinary
    # loopback install needs nothing here. It is the reverse-proxy case that
    # cannot be derived: the browser writes the proxy's **public** host into
    # `Host`, this process never sees it, and everything not listed is refused
    # with 403. Exact strings only, no wildcards: a suffix rule would admit
    # `127.0.0.1.attacker.example.com`, which is the attack (a wildcard DNS name
    # resolving to loopback) this list exists to refuse.
    allowedHosts: !!js (process.env.IRIS_ALLOWED_HOSTS ?? '').split(',').filter(Boolean)

# The application half: the protocol handlers over the domain packages.
- id: app
  name: '@iris/app-service'
  config:
    # **One host per data directory, enforced.** On startup the app service
    # creates `<dataDir>/host.lock` with `open(path, 'wx')` and refuses to start
    # when the pid it already names is running — every store here is a
    # whole-file rewrite from memory, so a second host's save overwrites the
    # first's newer file whole and silently (it has happened on this machine;
    # `notes/packages/iris-app-service/DEVIATIONS.md` §71). A lock left by a
    # process that is gone is stale: the next host takes it over and says so.
    # Released on an orderly shutdown, never on a crash — that is what the
    # liveness check is for.
    #
    # **There is no override flag, on purpose.** Running a second host is still
    # supported and takes a second `IRIS_DATA_DIR`, which is a copy away. Note
    # that this is about the *directory*, not the port: two hosts on 8787 and
    # 8790 sharing one `./data` is exactly the case a port check cannot see.
    dataDir: !!js process.env.IRIS_DATA_DIR ?? './data'
    # Storage is profile-scoped. The default matches SillyTavern's own
    # `data/<user>/` layout, so pointing IRIS_DATA_DIR at an existing install
    # finds its characters where they already are.
    profile: !!js process.env.IRIS_PROFILE ?? 'default-user'
    provider: default
    model: !!js process.env.IRIS_MODEL ?? 'local-model'
    userName: !!js process.env.IRIS_USER_NAME ?? 'User'
    contextWindow: !!js Number(process.env.IRIS_CONTEXT_WINDOW ?? 32768)
    # When a conversation overflows its budget, give up its oldest floors in
    # multiples of this many. A trim that drops exactly what does not fit has to
    # trim again on the next turn, so the oldest floor the model is shown moves
    # every turn and a provider that caches on the request prefix re-pays for the
    # whole conversation every turn; rounding the count up holds that floor still
    # for about half a block's worth of turns. Unset on purpose — `undefined`
    # reaches the plugin as absent and `@iris/pipeline`'s
    # `DEFAULT_TRIM_BLOCK_FLOORS` is the decision, so this row cannot make the
    # schema default dead code the way the old `pruneVariables` row did.
    # `IRIS_TRIM_BLOCK=0` restores SillyTavern's per-floor trim.
    # Quoted, because an unquoted plain scalar cannot carry a colon followed by
    # a space: YAML reads the ternary's `: ` as a nested mapping and the row
    # arrives as an object instead of an expression.
    trimBlockFloors: !!js "process.env.IRIS_TRIM_BLOCK === undefined ? undefined : Number(process.env.IRIS_TRIM_BLOCK)"
    presetPath: !!js process.env.IRIS_PRESET
    # The SillyTavern **profile** directory (`…/data/<user>`, never the install
    # root) that preset import reads from and book materialisation consults.
    # Read-only, and refused at boot if it overlaps dataDir. Unset by default,
    # and never guessed — without it the import row does not exist.
    sillyTavernDir: !!js process.env.IRIS_ST_DIR
    # `pruneVariables` is deliberately **not** a row here. The sweep trims the
    # five MVU variable keys off older floors and nothing restores them —
    # upstream can replay state forward from a snapshot and this host cannot —
    # so the schema's default is `false` (an opt-out, never a silent opt-in;
    # `notes/packages/iris-app-service/DEVIATIONS.md` §8 and its correction).
    # This file used to carry `!!js process.env.IRIS_PRUNE_VARIABLES !== "false"`,
    # which turned the sweep back on for anyone who had not heard of that
    # variable and made the schema default unreachable from the product
    # composition. `apps/iris/tests/composition.test.ts` parses this file and
    # holds the line. To opt in, add `pruneVariables: true` to this row.
    # The same value the frontend row takes. Given here too so the sandbox's own
    # artifacts (bootstrap.js, preset.js) can be served with a CORS header: the
    # card frame that loads them is an opaque origin, and the plugin serving the
    # rest of the dist has no way to set one.
    webDistIndex: !!js process.env.IRIS_WEB_DIST
    # The cards' EJS prompt templates — the ST-Prompt-Template capability as a
    # first-party Iris feature (`notes/FEATURE-PROMPT-TEMPLATE.md`). This row is
    # the **boot default**, not the switch: the user's own decision, persisted in
    # the profile's settings.json and set over the wire with
    # `template.setSettings`, wins once it exists. Until then the default holds,
    # and it is off because evaluating a template is running the card author's
    # JavaScript — contained in a child process with no environment, no
    # filesystem writes and no host objects in reach, but containment is not a
    # reason to opt someone in.
    templates: !!js process.env.IRIS_TEMPLATES === '1'
    # Conversation snapshots kept per chat before the oldest is deleted. The
    # host snapshots a conversation before deleting a message from it, before a
    # card's replay batch becomes the stored file, and before a restore writes
    # over it. Upstream keeps 50 by default.
    backupKeep: !!js Number(process.env.IRIS_BACKUP_KEEP ?? 50)
    # Request bodies kept per conversation, so a cache miss can be attributed
    # after the fact — the record CACHE-PREFIX.md §5.3 asked for. On by default,
    # because the question it answers ("why is this conversation paying full
    # price every turn") is one the user has already asked and nothing else can
    # answer, and because the data never leaves the machine: it is the user's
    # own prompts, in the user's own profile directory, bounded and deletable.
    #
    # Two spellings, so the common one is short: IRIS_CACHE_TRACE=0 turns it
    # off entirely, IRIS_CACHE_TRACE_KEEP=N sets the retention. The off switch
    # comes first in the chain so it wins over any keep count, which is the
    # reading a person typing 0 expects.
    #
    # Spelled with `&&` and `||` rather than the obvious ternary because
    # **`?` and `: ` are YAML indicators**: a plain scalar containing `X ? 0 :
    # Number(...)` parses as a mapping, and the row then interpolates to an
    # object. The schema catches it (`$.cacheTraceKeep expected number but got
    # [object Object]`, which is how this was found) but only at boot, so the
    # form here is the one that cannot produce it.
    cacheTraceKeep: !!js Number((process.env.IRIS_CACHE_TRACE === '0' && '0') || process.env.IRIS_CACHE_TRACE_KEEP || 8)

# The built interface, served from the same origin as the transport — which is
# what keeps the page out of CORS entirely. Disabled when there is no build, so
# a fresh checkout still boots and the headless tests still run.
- id: frontend
  name: '@deepseek-ai/dsh-host-frontend-static'
  # Spelled as a comparison, not `!process.env...`: a `!` straight after the
  # `!!js` tag reads as a second YAML tag and the document fails to parse.
  disabled: !!js process.env.IRIS_WEB_DIST === undefined
  config:
    distIndex: !!js process.env.IRIS_WEB_DIST
