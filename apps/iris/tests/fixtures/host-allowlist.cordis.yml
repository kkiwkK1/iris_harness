# A composition for the `Host` allow-list test: the carrier on an ephemeral
# port, the transport with one opted-into dev origin, and the application —
# which is where the other four Iris-owned routes (avatar, /version, the script
# bundle, the sandbox assets) come from. Separate from `transport.cordis.yml`
# because this one needs `webDistIndex` set, which mounts the sandbox route.
#
# `port: 0` is not incidental here: the allow-set is derived from the port the
# carrier *bound*, so every assertion in the file is also an assertion that the
# derivation reads the bound port rather than the configured one.

- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: '127.0.0.1'
    port: 0

- id: rpc
  name: '@iris/rpc-host'
  config:
    heartbeatMs: 0
    allowedOrigins:
      - 'http://iris.test'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-openai-compat
  name: '@iris/llm-openai-compat'
  config:
    provider: default
    displayName: mock
    baseURL: 'http://127.0.0.1:1/v1'
    models:
      - id: mock-model
        contextWindow: 32768

- id: app
  name: '@iris/app-service'
  config:
    dataDir: !!js process.env.IRIS_TEST_DATA_DIR
    provider: default
    model: mock-model
    userName: Traveller
    # Mounts the sandbox-asset route, which is one of the four the application
    # registers on the same carrier and therefore one of the four this checks.
    webDistIndex: !!js process.env.IRIS_TEST_WEB_DIST
