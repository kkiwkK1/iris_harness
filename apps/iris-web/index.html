<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The closed aperture, as a data URI.
         This used to be `data:,` — an empty icon whose only job was to stop the
         browser requesting /favicon.ico, which the host 404s once per page load
         (measured during the six-card QA run, on every card). That job is still
         done: a data URI is never fetched. What it now also does is give the tab
         the product's own mark — the identity the sidebar's head carries
         (`app/marks.tsx`, `ApertureMark`), drawn shut, because a closed
         aperture at 16px reads as a ring with a dot while an open one reads as
         noise.
         The plum `#b3374a` is a literal here because a favicon has no
         stylesheet and so no tokens, exactly like the ground colours the
         pre-paint script below duplicates for the same reason.
         `shell-page.test.ts` holds it to 雪's own `--iris-accent`, so the two
         cannot drift in silence. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Ccircle cx='22' cy='22' r='20' fill='none' stroke='%23b3374a' stroke-width='2.2'/%3E%3Ccircle cx='22' cy='22' r='6.5' fill='%23b3374a'/%3E%3C/svg%3E"
    />
    <title>Iris</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      /*
       * Framed: refuse to render. This runs before anything else in the page.
       *
       * Iris is an unauthenticated local interface. Every button on it acts
       * with the user's whole authority — it spends their tokens, reads their
       * conversations, edits their connection profiles — and it asks for no
       * credential, because the thing that protects it is that only this
       * machine can reach it. A hostile page cannot *read* this one (it is a
       * different origin), but it can put it in an invisible frame under its
       * own buttons and let the reader click Iris's while believing they are
       * clicking something else. That is click-jacking, and the platform's
       * answer to it is the `frame-ancestors` directive or the older
       * `X-Frame-Options` header.
       *
       * **Neither is available here, and this is the substitute.**
       * `frame-ancestors` is ignored in a `<meta>` by definition, and a header
       * would have to be written by whoever answers for this document — which
       * is `@deepseek-ai/dsh-host-frontend-static`, an external package holding
       * the carrier's fallback seat with no hook for one. So the page checks
       * for itself and refuses.
       *
       * This is honestly weaker than a header: a header stops the browser
       * *before* the document exists, while this runs after it has been fetched
       * and parsed this far, and it depends on the page's own script running at
       * all. It is what can be done from inside the document.
       * (`notes/apps/iris-web/DEVIATIONS.md` §93.)
       */
      ;(function refuseFraming() {
        if (window.top === window.self) return
        // Abort the parser first: everything below this script — the module
        // entry, the stylesheet — must not load. Replacing the document is the
        // visible half; not booting the app is the half that matters.
        window.stop()
        var root = document.documentElement
        while (root.firstChild !== null) root.removeChild(root.firstChild)
        var head = document.createElement('head')
        var charset = document.createElement('meta')
        charset.setAttribute('charset', 'utf-8')
        head.appendChild(charset)
        var title = document.createElement('title')
        title.textContent = 'Iris'
        head.appendChild(title)
        root.appendChild(head)
        var body = document.createElement('body')
        body.setAttribute('data-iris-framed', 'refused')
        body.setAttribute(
          'style',
          'margin:0;padding:2rem;font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;' +
            'background:#12171d;color:#e6e8ea'
        )
        body.textContent =
          'Iris 不在框架里打开：这一页被别的页面嵌着，而它无法确认嵌它的是谁——请在自己的标签页里打开 Iris。' +
          '(Iris refuses to render inside a frame.)'
        root.appendChild(body)
      })()
    </script>
    <script>
      /*
       * Theme before first paint.
       *
       * The stored preference has to reach the root element before any stylesheet
       * paints, or every reload flashes the wrong ground colour behind a page of
       * prose. Ground colours are duplicated here on purpose — this runs before
       * tokens.css exists, so it cannot read a custom property.
       */
      (function paintGround() {
        var stored = null
        try {
          stored = window.localStorage.getItem('iris.theme')
        } catch (error) {
          stored = null
        }
        var root = document.documentElement
        // A named theme wins; anything else (absent, `system`, an unknown word
        // from another build) follows the OS. The named themes' grounds are
        // duplicated here on purpose — this runs before tokens.css exists, so
        // it cannot read a custom property, and the palette tables in
        // theme/presets.ts must keep agreeing with these literals.
        if (stored === 'parchment') {
          root.setAttribute('data-iris-theme', 'parchment')
          root.style.backgroundColor = '#f4eede'
          root.style.colorScheme = 'light'
          return
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-iris-theme', dark ? 'dark' : 'light')
        root.style.backgroundColor = dark ? '#12171d' : '#f5f6f7'
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <script>
      /*
       * The registration facade, installed before any bundle runs.
       *
       * This has to be a classic inline script: `@deepseek-ai/dsh-client-modules/client`
       * is not an ordinary module — its body IS a bundle registration
       * (`window.__ModuleLoader__.load({id, factory})`), so the facade must
       * already exist the moment that bundle executes. In a real deployment the
       * host injects this same shim into the served index.
       */
      (function installModuleLoaderFacade() {
        var MODULES_ID = '@deepseek-ai/dsh-client-modules'
        var pendingQueue = []
        var target = {
          mode: 'queue',
          pendingQueue: pendingQueue,
          load: function (registration) {
            pendingQueue.push(registration)
          },
          create: function (options) {
            var index = pendingQueue.findIndex(function (row) { return row.id === MODULES_ID })
            if (index === -1) throw new Error('iris: the modules bundle never registered')
            var registration = pendingQueue.splice(index, 1)[0]
            // Materialize the bootstrap bundle by hand — the one module that
            // cannot arrive through the module system it defines.
            var exports = registration.factory(function (spec) {
              throw new Error('iris: modules bootstrap required "' + spec + '"')
            })
            return exports.createClientModuleSystem(target, { id: registration.id, exports: exports }, options)
          },
        }
        window.__ModuleLoader__ = target
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
